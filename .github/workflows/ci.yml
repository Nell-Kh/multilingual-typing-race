name: CI

on:
  pull_request:
  push:
    branches: [main]

# If you push twice to the same PR, cancel the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real Postgres + Redis next to the job, for integration tests from M1 on.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: typing
          POSTGRES_PASSWORD: typing
          POSTGRES_DB: typing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U typing -d typing"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://typing:typing@localhost:5432/typing
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy app tests

      - name: Test (pytest)
        run: python -m pytest -q

  frontend:
    name: frontend (oxlint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

  e2e:
    name: e2e (register → practice → leaderboard)
    runs-on: ubuntu-latest

    # The same Postgres and Redis the backend job uses: this test is about the
    # whole stack agreeing, so nothing here is a stub.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: typing
          POSTGRES_PASSWORD: typing
          POSTGRES_DB: typing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U typing -d typing"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://typing:typing@localhost:5432/typing
      REDIS_URL: redis://localhost:6379/0
      API_URL: http://localhost:8000
      WEB_PORT: "4173"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install the API
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrate and seed
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.cli seed-texts

      - name: Start the API
        working-directory: backend
        # The browser loads the page from WEB_PORT, so that origin has to be allowed.
        env:
          CORS_ORIGINS: http://localhost:4173
          # Every account this job creates comes from the runner's one address, which
          # is exactly what the per-address ceiling is there to stop (ADR-022). Raised
          # rather than switched off, so the limiter still runs in the path under test.
          RATE_LIMIT_REGISTER_PER_IP: "200"
          RATE_LIMIT_LOGIN_PER_IP: "200"
          RATE_LIMIT_REFRESH_PER_IP: "400"
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level info > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS "$API_URL/healthz" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "$API_URL/healthz"

      - name: Build the frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run build

      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test
        working-directory: e2e
        run: npm test

      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            ${{ runner.temp }}/api.log
          retention-days: 7
